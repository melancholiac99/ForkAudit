name: CTHA online RL CPU checks

on:
  push:
    branches: [credit-grok]
    paths:
      - 'exploratory_ctha/**'
      - '.github/workflows/ctha_cpu.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU analysis dependency
        run: python -m pip install 'numpy>=1.24,<3'
      - name: Compile online RL code
        run: python -m py_compile exploratory_ctha/*.py
      - name: Synthetic end-to-end preparation and isolation tests
        run: python -m unittest discover -s exploratory_ctha -p 'test_ctha*.py' -v
      - name: Check run driver command construction (no GPU)
        run: python exploratory_ctha/run.py --dry-run --model /tmp/nonexistent-model --run-dir /tmp/ctha-dry --rounds 2 --tasks-per-round 4 --reps 2 --feature-window 2 --train-horizon 0 --aux-horizon 2 --eval-every 1 --eval-games 3
